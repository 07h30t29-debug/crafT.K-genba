<script>let lock=false;const els={mm:document.getElementById('mm'),sun:document.getElementById('sun'),shaku:document.getElementById('shaku'),ken:document.getElementById('ken')};
function f(src){if(lock)return;lock=true;let mm=src==='mm'?(+els.mm.value||0):src==='sun'?(+els.sun.value||0)*30.303:src==='shaku'?(+els.shaku.value||0)*303.03:(+els.ken.value||0)*1818.18;
if(src!=='mm')els.mm.value=mm?mm.toFixed(1):'';if(src!=='sun')els.sun.value=mm?(mm/30.303).toFixed(3):'';if(src!=='shaku')els.shaku.value=mm?(mm/303.03).toFixed(3):'';if(src!=='ken')els.ken.value=mm?(mm/1818.18).toFixed(3):'';lock=false;}
Object.keys(els).forEach(k=>els[k].addEventListener('input',()=>f(k)));</script>
