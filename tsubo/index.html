<section class="hero"><h1>坪・㎡・畳 計算</h1><p>坪・㎡・畳のどれか1つを入力すると、残りを自動で換算します。</p></section>

<label>㎡<input id="b" type="number" inputmode="decimal" step="0.01"></label>
<label>畳<input id="c" type="number" inputmode="decimal" step="0.1"></label>

<script>let lock=false;const a=document.querySelector('#a'),b=document.querySelector('#b'),c=document.querySelector('#c');
function f(src){if(lock)return;lock=true;let m=src===a?(+a.value||0)*3.305785:src===b?(+b.value||0):(+c.value||0)*1.62;
if(src!==a)a.value=m?(m/3.305785).toFixed(2):'';if(src!==b)b.value=m?m.toFixed(2):'';if(src!==c)c.value=m?(m/1.62).toFixed(1):'';lock=false;}
[a,b,c].forEach(x=>x.addEventListener('input',()=>f(x)));</script>
