<section class="hero"><h1>階段 簡易計算</h1><p>階高・希望蹴上・踏面を入力してください。</p></section>
<section class="card"><label>階高 mm<input id="h" type="number" inputmode="decimal"></label><label>希望蹴上 mm<input id="r" type="number" value="190"></label><label>踏面 mm<input id="t" type="number" value="240"></label>
<div class="result">蹴上数：<strong><span id="rc">0</span>段</strong><br>実蹴上：<strong><span id="ar">0.0</span>mm</strong><br>踏面数：<strong><span id="tc">0</span></strong><br>水平長さ：約 <strong><span id="run">0</span>mm</strong></div></section>

<script>function f(){let h=+document.getElementById('h').value||0,r=+document.getElementById('r').value||190,t=+document.getElementById('t').value||240;if(!h){rc.textContent=0;ar.textContent='0.0';tc.textContent=0;run.textContent=0;return;}let n=Math.max(1,Math.ceil(h/r)),a=h/n,tt=Math.max(0,n-1);rc.textContent=n;ar.textContent=a.toFixed(1);tc.textContent=tt;run.textContent=Math.round(tt*t);}['h','r','t'].forEach(id=>document.getElementById(id).addEventListener('input',f));f();</script>
