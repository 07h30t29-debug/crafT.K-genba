<section class="hero"><h1>クロス 面積計算</h1><p>開口部控除とロス率を入れて概算できます。</p></section>
<section class="card"><div class="calc-grid"><div><label>部屋 長さ m<input id="l" type="number"></label></div><div><label>部屋 幅 m<input id="w" type="number"></label></div></div>
<div class="calc-grid"><div><label>天井高 m<input id="h" type="number" value="2.4"></label></div><div><label>開口控除 ㎡<input id="d" type="number" value="0"></label></div></div>
<label>ロス率 %<select id="loss"><option>0</option><option>5</option><option selected>10</option><option>15</option></select></label>
<div class="result">壁：<strong><span id="wall">0.00</span>㎡</strong><br>天井：<strong><span id="ceil">0.00</span>㎡</strong><br>ロス込み合計：<strong><span id="total">0.00</span>㎡</strong></div></section>

<script>function f(){let l=+document.querySelector('#l').value||0,w=+document.querySelector('#w').value||0,h=+document.querySelector('#h').value||0,d=+document.querySelector('#d').value||0,loss=+document.querySelector('#loss').value||0;
let wall=Math.max(0,2*(l+w)*h-d),ceil=l*w;document.querySelector('#wall').textContent=wall.toFixed(2);document.querySelector('#ceil').textContent=ceil.toFixed(2);document.querySelector('#total').textContent=((wall+ceil)*(1+loss/100)).toFixed(2);}['l','w','h','d','loss'].forEach(id=>{let e=document.getElementById(id);e.addEventListener('input',f);e.addEventListener('change',f)});f();</script>
